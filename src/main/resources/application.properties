spring.application.name=InventoryManagementSystem
server.port=${PORT:8090}

# PostgreSQL Database Configuration
# Local dev keeps working via the defaults after each colon;
# Cloud Run overrides these with real values via --set-env-vars / --set-secrets
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorymanagementsystem-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this}
jwt.expiration=604800000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.example.erp=DEBUG

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always

# Phase 33/34 — inspection photo uploads (previously flagged as a missing backend API; the
# frontend's Photos section existed but had nowhere real to send a file). Stored on local disk,
# not in the database — Postgres bytea would work but bloats every backup/replication cycle for
# no benefit at this scale.
app.upload-dir=uploads/inspection-photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HRM/payroll — no timezone was configured anywhere before this (JVM/server default only),
# which is fine until something is date-sensitive across a boundary, like the monthly payroll
# cron (PayrollServiceImpl.runMonthlyPayroll, "1st of the month, previous month's payroll").
# Pinned explicitly so that job (and any date/time serialized to the frontend) behaves the same
# regardless of what timezone the underlying host/container happens to run in.
spring.jackson.time-zone=Asia/Kolkata
app.timezone=Asia/Kolkata

# Pre-deployment fix — health check for Cloud Run (or any orchestrator) to know the container is
# alive. Only /actuator/health is exposed; everything else (env, beans, configprops, ...) stays
# closed by default since those leak configuration/secret-adjacent details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
