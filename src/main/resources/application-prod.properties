# Pre-deployment fix — production overrides, activated via SPRING_PROFILES_ACTIVE=prod at
# deploy time (e.g. Cloud Run's --set-env-vars). Everything here is additive on top of
# application.properties, which keeps its dev-friendly defaults untouched for local development
# and anyone who doesn't set this profile. Only the values that are actually unsafe or noisy in a
# real production deployment are overridden below.

# Never log every SQL statement in production — perf cost plus needless verbosity in logs that
# may contain customer data.
spring.jpa.show-sql=false

# application.properties defaults to `update` (auto-alters the schema on every boot — convenient
# for local dev with no migration tool, dangerous against a real production database). Production
# must validate the schema matches the entities instead of silently changing it; if it doesn't,
# fail startup rather than run against a mismatched schema.
spring.jpa.hibernate.ddl-auto=validate

# Don't leak internal exception messages or bean-validation field details to API clients by
# default in production — application.properties' `always` is meant for local development.
server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

logging.level.root=WARN
logging.level.com.example.InventoryManagementSystem=INFO
